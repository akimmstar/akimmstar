
name: Generate Arcade Contribution Animations

on:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * *'

permissions:
  contents: write

jobs:
  build-arcade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: akimmstar
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate Pac-Man and Breakout animations
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: akimmstar
          games: 'pacman,breakout'
          hide_month_labels: 'false'

      - name: Publish all SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
